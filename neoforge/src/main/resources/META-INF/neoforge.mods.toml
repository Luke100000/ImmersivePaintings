modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="${mod_issues}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL="${mod_homepage}" #optional (displayed in the mod UI)
logoFile = "icon.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
displayTest="IGNORE_SERVER_VERSION"
itemIcon = "immersive_paintings:painting"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "fzzy_config"
versionRange = "[${fzzy_config_version_neo},)"
ordering = "AFTER"
side = "BOTH"

