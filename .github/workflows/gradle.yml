name: Java CI with Gradle

on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessary for creating GitHub releases
    env:
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v2
      - name: Fetch Tags
        run: git fetch --unshallow --tags
      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload Artifacts - NeoForge
        uses: actions/upload-artifact@v4
        with:
          name: neoforge_artifacts
          path: ./neoforge/build/libs/
      - name: Upload Artifacts - Fabric
        uses: actions/upload-artifact@v4
        with:
          name: fabric_artifacts
          path: ./fabric/build/libs/
      - name: Get tag
        if: ${{ success() }}
        id: tag
        uses: dawidd6/action-get-tag@v1
      - uses: jungwinter/split@v2
        id: split
        with:
          separator: "+"
          msg: ${{steps.tag.outputs.tag}}
      - name: "Upload Fabric"
        uses: Kir-Antipov/mc-publish@v3.3
        if: ${{ success() }}
        with:
          modrinth-id: 6txNkua3
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: 639584
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          github-token: ${{ env.GITHUB_TOKEN }}

          name: "[Fabric ${{steps.split.outputs._1}}] Immersive Paintings - ${{steps.split.outputs._0}}"
          changelog-file: changelog.md
          version-type: release
          files: "fabric/build/libs/immersive_paintings-fabric-${{steps.split.outputs._1}}-${{steps.split.outputs._0}}.jar"
          loaders: |
            fabric
          game-versions: |
            ${{steps.split.outputs._1}}
          java: |
            Java 21

          fail-mode: skip
      - name: "Upload NeoForge"
        uses: Kir-Antipov/mc-publish@v3.3
        if: ${{ success() }}
        with:
          modrinth-id: 6txNkua3
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: 639584
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          github-token: ${{ env.GITHUB_TOKEN }}

          name: "[NeoForge ${{steps.split.outputs._1}}] Immersive Paintings - ${{steps.split.outputs._0}}"
          changelog-file: changelog.md
          version-type: release
          files: "neoforge/build/libs/immersive_paintings-neoforge-${{steps.split.outputs._1}}-${{steps.split.outputs._0}}.jar"
          loaders: |
            neoforge
          game-versions: |
            ${{steps.split.outputs._1}}
          java: |
            Java 21

          fail-mode: skip